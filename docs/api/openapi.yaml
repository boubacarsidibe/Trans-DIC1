          - RESOLVED
        impact:
          type: string
          enum:
          - NONE
          - MINOR
          - MAJOR
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        author:
          type: string
        automatic:
          type: boolean
