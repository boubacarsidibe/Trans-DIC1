        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewRequest"
        required: true
      responses:
        "404":
          description: Vue introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
