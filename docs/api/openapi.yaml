openapi: 3.1.0
info:
  title: API Trans-DIC1
  description: "API de supervision des infrastructures réseau et serveurs de l'EPT.\
    \ Obtenez un jeton avec POST /api/v1/auth/login, puis cliquez sur « Authorize\
    \ » et collez-le sans le préfixe Bearer."
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Alertes
  description: "Consultation pour tous les rôles ; prise en charge et résolution pour\
    \ NOC_OPERATOR et ADMIN ; assignation, archivage et suppression pour ADMIN."
- name: Métriques
  description: Mesures collectées sur les équipements.
- name: Agents de collecte
  description: Enregistrement des agents par un administrateur et réception de leurs
    mesures (jeton d'agent).
- name: Équipements
  description: Inventaire des équipements supervisés. Écriture réservée aux rôles
    ADMIN et NOC_OPERATOR.
- name: Règles d'alerte
  description: "Seuils, durée de confirmation, seuil de retour et portée. Lecture\
    \ pour tous les rôles, écriture réservée aux administrateurs."
- name: Vue d'ensemble
  description: Chiffres clés du tableau de bord.
- name: Authentification
  description: Jeton d'accès (corps de la réponse) et jeton de renouvellement (cookie
    HttpOnly).
paths:
  /api/v1/regles-alertes/{id}:
    get:
      tags:
      - Règles d'alerte
      summary: Consulter une règle
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Règle introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Règles d'alerte
      summary: Remplacer une règle et sa portée
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
        required: true
      responses:
        "400":
          description: Règle invalide
        "404":
          description: Règle introuvable
        "409":
          description: Nom déjà utilisé
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Règles d'alerte
      summary: Supprimer une règle
      description: "Refusé si la règle a déjà produit des alertes : désactivez-la."
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Règle introuvable
        "409":
          description: La règle a produit des alertes
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/equipements/{id}:
    get:
      tags:
      - Équipements
      summary: Consulter un équipement
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Équipement introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Équipements
      summary: Modifier un équipement
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentRequest"
        required: true
      responses:
        "400":
          description: Données invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "404":
          description: Équipement introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "409":
          description: Code d'inventaire déjà utilisé
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Équipements
      summary: Supprimer un équipement
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Équipement supprimé
        "404":
          description: Équipement introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/regles-alertes:
    get:
      tags:
      - Règles d'alerte
      summary: Lister les règles
      description: "Liste paginée (20 par page, tri par nom)."
      operationId: list
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelAlertRuleResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Règles d'alerte
      summary: Créer une règle
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
        required: true
      responses:
        "400":
          description: Règle invalide
        "409":
          description: Nom déjà utilisé
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/equipements:
    get:
      tags:
      - Équipements
      summary: Lister les équipements
      description: "Liste paginée (20 par page, tri par nom), filtrable par site,\
        \ type et statut."
      operationId: list_1
      parameters:
      - name: siteId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - SERVER
          - ROUTER
          - SWITCH
          - VIRTUAL_MACHINE
          - WIFI_ACCESS_POINT
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - UP
          - DOWN
          - DEGRADED
          - MAINTENANCE
          - UNKNOWN
      - name: p
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelEquipmentResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Équipements
      summary: Créer un équipement
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentRequest"
        required: true
      responses:
        "201":
          description: Équipement créé
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "400":
          description: Données invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "409":
          description: Code d'inventaire déjà utilisé
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/equipements/{equipmentId}/agent:
    post:
      tags:
      - Agents de collecte
      summary: Enregistrer l'agent d'un équipement
      description: "Crée un agent actif et retourne son jeton, affiché une seule fois.\
        \ Un agent déjà actif sur l'équipement est révoqué."
      operationId: register
      parameters:
      - name: equipmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Équipement introuvable
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgentRegistrationResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Agents de collecte
      summary: Révoquer l'agent d'un équipement
      operationId: revoke
      parameters:
      - name: equipmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Aucun agent actif
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentification
      summary: Renouveler le jeton d'accès
      description: "Lit le cookie de renouvellement, le remplace par un nouveau (rotation)\
        \ et retourne un nouveau jeton d'accès. Un jeton déjà utilisé révoque toute\
        \ la connexion."
      operationId: refresh
      parameters:
      - name: trans_dic1_refresh
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "401":
          description: "Cookie absent, expiré, révoqué ou déjà utilisé"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "403":
          description: Origine de la requête non autorisée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Authentification
      summary: Se déconnecter
      description: Révoque la connexion et efface le cookie. Sans effet si le cookie
        est absent.
      operationId: logout
      parameters:
      - name: trans_dic1_refresh
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Déconnecté
        "403":
          description: Origine de la requête non autorisée
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentification
      summary: Se connecter
      description: "Retourne un jeton JWT court à envoyer dans l'en-tête Authorization:\
        \ Bearer et dépose le jeton de renouvellement dans un cookie HttpOnly."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "400":
          description: Requête invalide
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Identifiants invalides ou compte verrouillé (réponse identique
            par sécurité)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "429":
          description: "Trop de tentatives depuis cette adresse, voir l'en-tête Retry-After"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
      security: []
  /api/v1/alertes/{id}/resolution:
    post:
      tags:
      - Alertes
      summary: Résoudre manuellement une alerte
      operationId: resolve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "409":
          description: Transition impossible depuis l'état actuel de l'alerte
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/alertes/{id}/prise-en-charge:
    post:
      tags:
      - Alertes
      summary: Prendre en charge une alerte ouverte
      operationId: take
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "409":
          description: Transition impossible depuis l'état actuel de l'alerte
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/alertes/{id}/assignation:
    post:
      tags:
      - Alertes
      summary: Assigner ou réassigner une alerte à un opérateur
      operationId: assign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentRequest"
        required: true
      responses:
        "400":
          description: Assigné invalide
        "409":
          description: Transition impossible depuis l'état actuel de l'alerte
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/alertes/{id}/archivage:
    post:
      tags:
      - Alertes
      summary: Archiver une alerte résolue
      operationId: archive
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "409":
          description: Transition impossible depuis l'état actuel de l'alerte
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/agent/measures:
    post:
      tags:
      - Agents de collecte
      summary: Envoyer des mesures (agent)
      description: "Authentifié par le jeton de l'agent dans l'en-tête Authorization:\
        \ Bearer. Les mesures sont stockées puis évaluées contre les règles d'alerte."
      operationId: receive
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMeasuresRequest"
        required: true
      responses:
        "400":
          description: Lot invalide ou horodatage dans le futur
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/vue-ensemble:
    get:
      tags:
      - Vue d'ensemble
      summary: Chiffres clés
      description: "Équipements par statut, alertes actives par sévérité, agents actifs."
      operationId: overview
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/metrics/latest:
    get:
      tags:
      - Métriques
      summary: Dernières métriques
      description: Dernière mesure connue par équipement et par indicateur.
      operationId: latest
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/alertes:
    get:
      tags:
      - Alertes
      summary: Lister les alertes
      description: "Liste paginée (20 par page, plus récentes d'abord), filtrable\
        \ par état et par équipement. Les alertes supprimées sont masquées."
      operationId: list_2
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - RESOLVED
          - ARCHIVED
          - DELETED
      - name: equipmentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelAlertResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/alertes/{id}:
    get:
      tags:
      - Alertes
      summary: Consulter une alerte et son historique
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Alerte introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Alertes
      summary: Supprimer une alerte
      description: "Suppression logique : l'alerte et son historique restent en base."
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "409":
          description: Transition impossible depuis l'état actuel de l'alerte
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    AlertRuleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        metricType:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "[a-z0-9][a-z0-9._-]*"
        operator:
          type: string
          enum:
          - GREATER_THAN
          - GREATER_OR_EQUAL
          - LESS_THAN
          - LESS_OR_EQUAL
          - EQUAL
        threshold:
          type: number
        recoveryThreshold:
          type: number
        unit:
          type: string
          maxLength: 24
          minLength: 0
        confirmationSeconds:
          type: integer
          format: int64
          maximum: 86400
          minimum: 0
        initialSeverity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        active:
          type: boolean
        siteIds:
          type: array
          items:
            type: string
            format: uuid
        equipmentIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - confirmationSeconds
      - initialSeverity
      - metricType
      - name
      - operator
      - threshold
    EquipmentRequest:
      type: object
      properties:
        inventoryCode:
          type: string
          maxLength: 64
          minLength: 0
        name:
          type: string
          maxLength: 120
          minLength: 0
        managementAddress:
          type: string
          maxLength: 45
          minLength: 0
        type:
          type: string
          enum:
          - SERVER
          - ROUTER
          - SWITCH
          - VIRTUAL_MACHINE
          - WIFI_ACCESS_POINT
        status:
          type: string
          enum:
          - UP
          - DOWN
          - DEGRADED
