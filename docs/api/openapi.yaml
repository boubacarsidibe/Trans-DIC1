          maxLength: 120
          minLength: 0
        type:
          type: string
          description: "Types pris en charge : TCP_PORT, HTTP, HTTPS, ICMP, TLS_CERT"
          enum:
          - TCP_PORT
          - HTTP
          - HTTPS
          - ICMP
          - TLS_CERT
        port:
          type: integer
          format: int32
          description: Obligatoire pour TCP_PORT
          maximum: 65535
          minimum: 1
        accessPoint:
          type: string
          maxLength: 255
          minLength: 0
        intervalSeconds:
          type: integer
          format: int32
          description: 60 par défaut
          maximum: 86400
          minimum: 30
        timeoutMs:
          type: integer
          format: int32
          description: 5000 par défaut
          maximum: 30000
          minimum: 100
        expectedStatus:
          type: string
          description: Code seul (200) ou plage (200-399) ; HTTP et HTTPS
          pattern: "[1-5][0-9]{2}(-[1-5][0-9]{2})?"
        expectedText:
          type: string
          description: Texte cherché dans la réponse ; HTTP et HTTPS seulement
          maxLength: 200
          minLength: 0
        slaTarget:
          type:
          - number
          - "null"
          format: double
          description: "Objectif de disponibilité sur 30 jours (0,995 pour 99,5 %)\
            \ ; laisser vide pour aucun objectif, auquel cas aucun budget d'erreur\
            \ n'est calculé"
          maximum: 1.0
          minimum: 0.5
        active:
          type: boolean
          description: Vrai par défaut
      required:
      - name
      - type
