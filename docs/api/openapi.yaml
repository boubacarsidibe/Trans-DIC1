openapi: 3.1.0
info:
  title: API Trans-DIC1
  description: "API de supervision des infrastructures réseau et serveurs de l'EPT.\
    \ Obtenez un jeton avec POST /api/v1/auth/login, puis cliquez sur « Authorize\
    \ » et collez-le sans le préfixe Bearer."
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Alertes
  description: "Consultation pour tous les rôles ; prise en charge et résolution pour\
    \ NOC_OPERATOR et ADMIN ; assignation, archivage et suppression pour ADMIN."
- name: Utilisateurs
  description: "Gestion des comptes, réservée aux administrateurs."
- name: Services découverts
  description: "Services système actifs et ports en écoute vus par l'agent ; suivre\
    \ un service en un clic ajoute service.up[nom] sans toucher à la configuration\
    \ de l'agent (ADR 0056)."
- name: Collecte SNMP
  description: Configuration de la lecture SNMP d'un équipement. Secrets par référence
    (env:NOM) uniquement.
- name: Maintenances
  description: "Fenêtres pendant lesquelles les alertes d'un site ou d'un équipement\
    \ sont tracées sans notification. Lecture pour tous, planification et annulation\
    \ pour ADMIN (ADR 0058)."
- name: Import de l'inventaire
  description: "Import CSV des équipements (code_inventaire;nom;adresse;type;statut;site)\
    \ : aperçu puis import des lignes valides. Réservé à ADMIN (ADR 0058)."
- name: Statut public
  description: "Lecture sans connexion d'une page de statut publique et active (ADR\
    \ 0026). Limitée par adresse IP, mise en cache 30 s, sans aucune donnée technique\
    \ interne."
- name: Règles d'alerte
  description: "Seuils, durée de confirmation, seuil de retour et portée. Lecture\
    \ pour tous les rôles, écriture réservée aux administrateurs."
- name: Découverte
  description: "Recherche SNMP d'équipements sur une plage autorisée par l'exploitation.\
    \ Les équipements trouvés sont proposés, jamais créés automatiquement. Réservé\
    \ aux administrateurs."
- name: Inscription des agents
  description: "Jetons d'inscription partagés (administrateur) et inscription d'un\
    \ agent par lui-même : il reçoit en retour son jeton personnel (ADR 0054)."
- name: Équipements
  description: Inventaire des équipements supervisés. Écriture réservée à ADMIN (ADR
    0058).
- name: Dépendances des services
  description: "Un service dépend d'un autre service : chaîne parcourue par la recherche\
    \ de cause racine (ADR 0056). Lecture pour tous, saisie pour les administrateurs\
    \ (ADR 0058)."
- name: Authentification
  description: Jeton d'accès (corps de la réponse) et jeton de renouvellement (cookie
    HttpOnly).
- name: Vues de tableau de bord
  description: Vues personnelles (widgets ordonnés) pour le tableau de bord et le
    mur d'écran NOC. Chaque utilisateur ne voit et ne modifie que ses propres vues.
- name: Périmètres d'accès
  description: "Sites visibles par un opérateur ou un lecteur ; sans site attribué\
    , tout le parc."
- name: Jetons d'API
  description: Jetons personnels pour appeler l'API depuis un autre outil.
- name: Sécurité
  description: Journaux de sécurité et attaques repérées.
- name: Actions correctives
  description: "Remédiation automatique (ADR 0050) : une règle d'alerte peut demander\
    \ à l'agent de l'équipement d'exécuter une action qu'il a lui-même déclarée (par\
    \ son nom)."
- name: Corrélations apprises
  description: "Liens entre équipements déduits de l'historique des alertes (M9, ADR\
    \ 0042). Consultation pour tous les rôles dans la limite du périmètre d'accès\
    \ ; acceptation et rejet réservés aux administrateurs et audités. Une proposition\
    \ ne sert à rien avant d'être acceptée."
- name: Incidents
  description: "Alertes regroupées en incidents (M10, ADR 0039) : un fait, une notification.\
    \ Consultation pour tous les rôles, dans la limite du périmètre d'accès. La prise\
    \ en charge et la résolution se font sur les alertes."
- name: Notifications
  description: Préférences de notification de l'utilisateur connecté.
- name: Hyperviseurs
  description: "Connecteurs d'hyperviseur (Proxmox VE) : hôtes, VM et conteneurs vus\
    \ sans agent, avec leur lien VM → hôte et leurs mesures (ADR 0055)."
- name: Sondes
  description: "Contrôles de disponibilité lancés depuis le serveur, sans agent (port\
    \ TCP, HTTP, HTTPS, ICMP, certificat TLS). Lecture selon le périmètre par site,\
    \ écriture réservée aux administrateurs."
- name: Pages de statut
  description: "Pages de statut des services (ADR 0026) : lecture des pages actives\
    \ pour tous les rôles (composants filtrés par le périmètre de sites), administration\
    \ réservée à ADMIN (10 pages, 50 composants par page), tracée dans le journal\
    \ d'audit."
- name: Modèles d'équipement
  description: "Bibliothèque de modèles livrés (indicateurs SNMP, règles et sondes\
    \ suggérées, ADR 0022). Catalogue en lecture pour tous ; aperçu et application\
    \ réservés aux administrateurs. Les modèles marqués non vérifiés n'ont pas été\
    \ validés sur matériel."
- name: Rapports
  description: "Disponibilité des équipements et incidents sur une période (400 jours\
    \ au plus), en JSON ou en CSV."
- name: Canaux de notification
  description: "Historique d'envoi, modèles de messages et envoi de test. Réservé\
    \ aux administrateurs. Les URL des canaux (webhook, Teams, Slack) ne sont jamais\
    \ stockées ni renvoyées : on ne manipule que la référence du secret (env:NOM)."
- name: Risque de panne
  description: "Prédiction explicable du risque de panne à 24 heures (ADR 0052), apprise\
    \ sur l'historique de la plateforme"
- name: Règles d'alerte
  description: "Seuils, durée de confirmation, hystérésis et portée des règles."
- name: Authentification
  description: "Connexion, renouvellement, mot de passe et double authentification."
- name: Temps réel
  description: Flux d'événements serveur (SSE) pour rafraîchir les écrans.
- name: Demandes de maintenance
  description: L'opérateur NOC demande une maintenance ; l'administrateur la valide
    (elle est alors planifiée) ou la refuse avec un motif (ADR 0058).
- name: Proxys de collecte
  description: "Enregistrement par un administrateur du relais de collecte d'un site,\
    \ et réception de ses lots de mesures, tampon hors ligne compris (jeton de proxy)."
- name: Topologie
  description: "Dépendances entre équipements et impact d'une panne. Consultation\
    \ pour tous les rôles, modification des liens par les administrateurs."
- name: Astreinte
  description: "Plannings d'astreinte, gardes, rotations et passation (ADR 0025).\
    \ Lecture pour tous les rôles dans leur périmètre de sites ; écriture des plannings\
    \ pour ADMIN ; passation d'une garde par son titulaire (ADMIN ou NOC_OPERATOR)\
    \ ou par ADMIN."
- name: Notifications
  description: Préférences de notification et liaison du compte Telegram
- name: Règles d'événements
  description: "Règles qui transforment un trap ou un message syslog en alerte EVENT\
    \ (ADR 0021). Lecture pour tous les rôles, écriture et essai réservés aux administrateurs."
- name: Métriques
  description: Mesures collectées sur les équipements.
- name: Agents de collecte
  description: Enregistrement des agents par un administrateur et réception de leurs
    mesures (jeton d'agent).
- name: Rapports
  description: "Rapports de disponibilité, d'incidents, de SLA et leurs envois planifié\
    s."
- name: Événements réseau
  description: "Traps SNMP et messages syslog reçus des équipements inventoriés (ADR\
    \ 0021). Lecture pour tous les rôles, limitée au périmètre d'accès par site."
- name: Sites
  description: Emplacements regroupant les équipements. Écriture réservée à ADMIN
    (ADR 0058).
- name: Vue d'ensemble
  description: Chiffres clés du tableau de bord.
- name: Trafic
  description: Flux réseau rapportés par les équipements (NetFlow).
- name: Authentification
  description: "Connexion, renouvellement et mot de passe."
- name: Journal d'audit
  description: "Consultation et export du journal des actions sensibles. Réservé aux\
    \ administrateurs ; le journal est en lecture seule, aucune route ne le modifie."
paths:
  /api/v1/vues/{id}:
    put:
      tags:
      - Vues de tableau de bord
      summary: Modifier une vue
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewRequest"
        required: true
      responses:
        "404":
          description: Vue introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Vues de tableau de bord
      summary: Supprimer une vue
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Vue introuvable
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sites/{id}:
    get:
      tags:
      - Sites
      summary: Consulter un site
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Site introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Sites
      summary: Modifier un site
      description: Le code ne peut pas changer.
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRequest"
        required: true
      responses:
        "400":
          description: Données invalides
        "404":
          description: Site introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Sites
      summary: Supprimer un site vide
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Site introuvable
        "409":
          description: Le site contient des équipements
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/regles-evenements/{id}:
    get:
      tags:
      - Règles d'événements
      summary: Consulter une règle d'événement
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Règle introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Règles d'événements
      summary: Remplacer une règle d'événement et sa portée
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRuleRequest"
        required: true
      responses:
        "400":
          description: Règle invalide
        "404":
          description: Règle introuvable
        "409":
          description: Nom déjà utilisé
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Règles d'événements
      summary: Supprimer une règle d'événement
      description: "Refusé si la règle a déjà ouvert des alertes : désactivez-la."
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Règle introuvable
        "409":
          description: La règle a ouvert des alertes
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/regles-alertes/{ruleId}/action-corrective:
    get:
      tags:
      - Actions correctives
      summary: Action corrective d'une règle
      description: 204 si la règle n'en a pas. Opérateurs NOC et administrateurs.
      operationId: policy
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Action configurée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "204":
          description: Aucune action sur cette règle
        "404":
          description: Règle introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Actions correctives
      summary: Définir l'action corrective d'une règle
      description: "mode=AUTO : l'action part dès l'ouverture de l'alerte ; APPROVAL\
        \ : elle attend qu'un opérateur l'approuve. Le délai de grâce (cooldownMinutes,\
        \ 30 par défaut) empêche de relancer l'action en boucle sur une alerte qui\
        \ clignote. Administrateurs."
      operationId: savePolicy
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
        required: true
      responses:
        "404":
          description: Règle introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Actions correctives
      summary: Retirer l'action corrective d'une règle
      description: Administrateurs.
      operationId: deletePolicy
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Règle ou action introuvable
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/regles-alertes/{id}:
    get:
      tags:
      - Règles d'alerte
      summary: Consulter une règle
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Règle introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Règles d'alerte
      summary: Remplacer une règle et sa portée
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
        required: true
      responses:
        "400":
          description: Règle invalide
        "404":
          description: Règle introuvable
        "409":
          description: Nom déjà utilisé
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Règles d'alerte
      summary: Supprimer une règle
      description: "Refusé si la règle a déjà produit des alertes : désactivez-la."
      operationId: delete_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Règle introuvable
        "409":
          description: La règle a produit des alertes
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/rapports/planifications/{id}:
    put:
      tags:
      - Rapports
      summary: Modifier un rapport planifié
      operationId: update_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
        required: true
      responses:
        "404":
          description: Planification introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Rapports
      summary: Supprimer un rapport planifié
      operationId: delete_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/perimetres/{userId}:
    put:
      tags:
      - Périmètres d'accès
      summary: Définir les sites d'un compte
      description: "Remplace la liste ; une liste vide rend l'accès à tout le parc.\
        \ Effet immédiat, tracé dans le journal d'audit."
      operationId: replace
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserScopeRequest"
        required: true
      responses:
        "400":
          description: Site inconnu ou compte administrateur
        "404":
          description: Utilisateur introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/pages-statut/{id}:
    get:
      tags:
      - Pages de statut
      summary: Détail d'une page pour l'administration
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Page introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Pages de statut
      summary: Modifier une page de statut (dont sa visibilité)
      operationId: update_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPageRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StatusPageDetail"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Pages de statut
      summary: Supprimer une page de statut
      description: Avec ses composants et incidents.
      operationId: delete_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
