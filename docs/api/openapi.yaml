  /api/v1/auth/refresh:
    post:
      tags:
      - Authentification
      summary: Renouveler le jeton d'accès
      description: "Lit le cookie de renouvellement, le remplace par un nouveau (rotation)\
        \ et retourne un nouveau jeton d'accès. Un jeton déjà utilisé révoque toute\
        \ la connexion."
      operationId: refresh
      parameters:
      - name: trans_dic1_refresh
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "401":
          description: "Cookie absent, expiré, révoqué ou déjà utilisé"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "403":
          description: Origine de la requête non autorisée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
      security: []
  /api/v1/auth/logout:
    post:
      tags:
