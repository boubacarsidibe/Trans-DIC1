openapi: 3.1.0
info:
  title: API Trans-DIC1
  description: "API de supervision des infrastructures réseau et serveurs de l'EPT.\
    \ Obtenez un jeton avec POST /api/v1/auth/login, puis cliquez sur « Authorize\
    \ » et collez-le sans le préfixe Bearer."
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Alertes
  description: "Consultation pour tous les rôles ; prise en charge et résolution pour\
    \ NOC_OPERATOR et ADMIN ; assignation, archivage et suppression pour ADMIN."
- name: Utilisateurs
  description: "Gestion des comptes, réservée aux administrateurs."
- name: Rapports
  description: "Disponibilité des équipements et incidents sur une période (400 jours\
    \ au plus), en JSON ou en CSV."
- name: Collecte SNMP
  description: Configuration de la lecture SNMP d'un équipement. Secrets par référence
    (env:NOM) uniquement.
- name: Équipements
  description: Inventaire des équipements supervisés. Écriture réservée aux rôles
    ADMIN et NOC_OPERATOR.
- name: Règles d'alerte
  description: "Seuils, durée de confirmation, seuil de retour et portée. Lecture\
    \ pour tous les rôles, écriture réservée aux administrateurs."
- name: Sites
  description: Emplacements regroupant les équipements. Écriture réservée à ADMIN
    et NOC_OPERATOR.
- name: Maintenances
  description: "Fenêtres pendant lesquelles les alertes d'un site ou d'un équipement\
    \ sont tracées sans notification. Lecture pour tous, planification et annulation\
    \ pour ADMIN et NOC_OPERATOR."
- name: Temps réel
  description: Flux d'événements serveur (SSE) pour rafraîchir les écrans.
- name: Authentification
  description: Jeton d'accès (corps de la réponse) et jeton de renouvellement (cookie
    HttpOnly).
- name: Métriques
  description: Mesures collectées sur les équipements.
- name: Agents de collecte
  description: Enregistrement des agents par un administrateur et réception de leurs
    mesures (jeton d'agent).
- name: Notifications
  description: Préférences de notification de l'utilisateur connecté.
- name: Vue d'ensemble
  description: Chiffres clés du tableau de bord.
paths:
  /api/v1/sites/{id}:
    get:
      tags:
      - Sites
      summary: Consulter un site
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Site introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Sites
      summary: Modifier un site
      description: Le code ne peut pas changer.
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRequest"
        required: true
      responses:
        "400":
          description: Données invalides
        "404":
          description: Site introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Sites
      summary: Supprimer un site vide
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Site introuvable
        "409":
          description: Le site contient des équipements
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/regles-alertes/{id}:
    get:
      tags:
      - Règles d'alerte
      summary: Consulter une règle
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Règle introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Règles d'alerte
      summary: Remplacer une règle et sa portée
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
        required: true
      responses:
        "400":
          description: Règle invalide
        "404":
          description: Règle introuvable
        "409":
          description: Nom déjà utilisé
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Règles d'alerte
      summary: Supprimer une règle
      description: "Refusé si la règle a déjà produit des alertes : désactivez-la."
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Règle introuvable
        "409":
          description: La règle a produit des alertes
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/mes-preferences:
    get:
      tags:
