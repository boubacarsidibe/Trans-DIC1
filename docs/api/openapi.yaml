      summary: Se déconnecter
      description: Révoque la connexion et efface le cookie. Sans effet si le cookie
        est absent.
      operationId: logout
      parameters:
      - name: trans_dic1_refresh
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Déconnecté
        "403":
          description: Origine de la requête non autorisée
      security: []
