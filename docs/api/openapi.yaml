      summary: Changer le rôle d'un compte
      description: Révoque les connexions du compte. Refusé sur soi-même ou sur le
        dernier administrateur.
      operationId: changeRole
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeRequest"
        required: true
      responses:
