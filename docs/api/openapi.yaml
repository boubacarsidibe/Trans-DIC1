          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreferenceResponse"
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
