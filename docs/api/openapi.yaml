components:
  schemas:
    SiteRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
          minLength: 0
          pattern: "[A-Za-z0-9._-]*"
        name:
          type: string
          maxLength: 120
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
        address:
          type: string
          maxLength: 255
          minLength: 0
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      required:
      - name
    AlertRuleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        metricType:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "[a-z0-9][a-z0-9._-]*"
        operator:
          type: string
          enum:
          - GREATER_THAN
          - GREATER_OR_EQUAL
          - LESS_THAN
          - LESS_OR_EQUAL
          - EQUAL
        threshold:
          type: number
        recoveryThreshold:
          type: number
        unit:
          type: string
          maxLength: 24
          minLength: 0
        confirmationSeconds:
          type: integer
          format: int64
          maximum: 86400
          minimum: 0
        initialSeverity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        active:
          type: boolean
        siteIds:
          type: array
          items:
            type: string
            format: uuid
        equipmentIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - confirmationSeconds
      - initialSeverity
      - metricType
      - name
      - operator
      - threshold
    PreferenceRequest:
      type: object
      properties:
        channel:
          type: string
          enum:
          - EMAIL
        minimumSeverity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        active:
          type: boolean
      required:
      - active
      - channel
      - minimumSeverity
    PreferenceResponse:
      type: object
      properties:
        channel:
          type: string
          enum:
          - EMAIL
        minimumSeverity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        active:
          type: boolean
        email:
          type: string
    EquipmentRequest:
      type: object
      properties:
        inventoryCode:
          type: string
          maxLength: 64
          minLength: 0
        name:
          type: string
          maxLength: 120
          minLength: 0
        managementAddress:
          type: string
          maxLength: 45
          minLength: 0
        type:
          type: string
          enum:
          - SERVER
          - ROUTER
          - SWITCH
          - VIRTUAL_MACHINE
          - WIFI_ACCESS_POINT
        status:
          type: string
          enum:
          - UP
          - DOWN
          - DEGRADED
          - MAINTENANCE
          - UNKNOWN
        siteId:
          type: string
          format: uuid
      required:
      - inventoryCode
      - managementAddress
      - name
      - siteId
      - status
      - type
    EquipmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
