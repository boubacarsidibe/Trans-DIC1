components:
  schemas:
    ViewRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 0
        widgets:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 0
          maxItems: 12
          minItems: 0
      required:
      - name
      - widgets
    SiteRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
          minLength: 0
          pattern: "[A-Za-z0-9._-]*"
        name:
          type: string
          maxLength: 120
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
        address:
          type: string
          maxLength: 255
          minLength: 0
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        slaTarget:
          type: number
          maximum: 100.0
          minimum: 50.0
      required:
      - name
    EventRuleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        source:
          type: string
          enum:
          - SNMP_TRAP
          - SYSLOG
        minSeverity:
          type: string
          enum:
          - EMERGENCY
          - ALERT
          - CRITICAL
          - ERROR
          - WARNING
          - NOTICE
          - INFO
          - DEBUG
        oidPrefix:
          type: string
          maxLength: 255
          minLength: 0
          pattern: "^$|^\\.?[0-9]+(\\.[0-9]+)*$"
        messageRegex:
          type: string
          maxLength: 200
          minLength: 0
        resolveOid:
          type: string
          maxLength: 255
          minLength: 0
          pattern: "^$|^\\.?[0-9]+(\\.[0-9]+)*$"
        resolveRegex:
          type: string
          maxLength: 200
          minLength: 0
        alertSeverity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        dedupWindowSeconds:
          type: integer
          format: int32
          maximum: 86400
          minimum: 0
        active:
          type: boolean
        siteIds:
          type: array
          items:
            type: string
            format: uuid
        equipmentIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - alertSeverity
      - name
    PolicyRequest:
      type: object
      description: Action corrective d'une règle d'alerte
      properties:
        actionName:
          type: string
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        mode:
          type: string
          enum:
          - AUTO
          - APPROVAL
        cooldownMinutes:
          type: integer
          format: int32
          maximum: 1440
          minimum: 0
        enabled:
          type: boolean
        verifyMinutes:
          type: integer
          format: int32
          description: "Délai de vérification après l'action, en minutes (0 = aucune)"
          maximum: 240
          minimum: 0
        maxAutoRuns:
          type: integer
          format: int32
          description: Exécutions automatiques au plus par équipement sur la fenêtre
          maximum: 100
          minimum: 1
        windowHours:
          type: integer
          format: int32
          description: "Fenêtre de la limite de fréquence, en heures"
          maximum: 168
          minimum: 1
      required:
      - actionName
      - mode
    AlertRuleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        metricType:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "[a-z0-9][a-z0-9._-]*(\\[[^\\[\\]]{1,48}\\])?"
        operator:
          type: string
          enum:
          - GREATER_THAN
          - GREATER_OR_EQUAL
          - LESS_THAN
          - LESS_OR_EQUAL
          - EQUAL
        threshold:
          type: number
        recoveryThreshold:
          type: number
        unit:
          type: string
          maxLength: 24
          minLength: 0
        confirmationSeconds:
          type: integer
          format: int64
          maximum: 86400
          minimum: 0
        initialSeverity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        active:
          type: boolean
        siteIds:
          type: array
          items:
            type: string
            format: uuid
        equipmentIds:
          type: array
          items:
            type: string
            format: uuid
        allEquipment:
          type: boolean
        adaptive:
          type: boolean
        adaptiveSensitivity:
          type: number
          maximum: 10
          minimum: 1.5
        adaptiveLimit:
          type: number
      required:
      - confirmationSeconds
      - initialSeverity
      - metricType
      - name
      - operator
      - threshold
    ScheduleRequest:
      type: object
      properties:
        name:
          type: string
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
        executionTime:
          type: string
        active:
          type: boolean
        recipientIds:
          type: array
          items:
            type: string
            format: uuid
        siteIds:
          type: array
          items:
            type: string
            format: uuid
    UserScopeRequest:
      type: object
      properties:
        siteIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
          minItems: 0
      required:
      - siteIds
    StatusPageRequest:
      type: object
      properties:
        slug:
          type: string
          description: "Partie de l'adresse /statut/{slug}"
          example: services-ept
          minLength: 1
          pattern: "[a-z0-9-]{3,60}"
        title:
          type: string
          maxLength: 120
          minLength: 0
          pattern: "[^<>\\p{Cntrl}]*"
        description:
          type: string
          maxLength: 500
          minLength: 0
          pattern: "[^<>\\x00-\\x09\\x0B-\\x1F\\x7F]*"
        visibility:
          type: string
          enum:
          - INTERNAL
          - PUBLIC
        active:
          type: boolean
          description: Vrai par défaut
      required:
      - slug
      - title
      - visibility
    ComponentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        groupName:
          type: string
        position:
          type: integer
          format: int32
        sourceType:
          type: string
          enum:
          - PROBE
          - EQUIPMENT
          - SITE
        sourceId:
          type: string
          format: uuid
        sourceLabel:
          type: string
          description: Libellé technique de la source (administrateurs seulement)
        sourceMissing:
          type: boolean
          description: Vrai si la source n'existe plus
        state:
          type: string
          enum:
          - OPERATIONAL
          - DEGRADED
          - PARTIAL_OUTAGE
          - MAJOR_OUTAGE
          - MAINTENANCE
          - UNKNOWN
    IncidentDetail:
      type: object
      properties:
