                $ref: "#/components/schemas/TokenResponse"
        "429":
          description: "Trop de tentatives depuis cette adresse, voir l'en-tête Retry-After"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
      security: []
