openapi: 3.1.0
info:
  title: API Trans-DIC1
  description: "API de supervision des infrastructures réseau et serveurs de l'EPT.\
    \ Obtenez un jeton avec POST /api/v1/auth/login, puis cliquez sur « Authorize\
    \ » et collez-le sans le préfixe Bearer."
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Alertes
  description: "Consultation pour tous les rôles ; prise en charge et résolution pour\
    \ NOC_OPERATOR et ADMIN ; assignation, archivage et suppression pour ADMIN."
- name: Utilisateurs
  description: "Gestion des comptes, réservée aux administrateurs."
- name: Rapports
  description: "Disponibilité des équipements et incidents sur une période (400 jours\
    \ au plus), en JSON ou en CSV."
- name: Collecte SNMP
  description: Configuration de la lecture SNMP d'un équipement. Secrets par référence
    (env:NOM) uniquement.
- name: Équipements
  description: Inventaire des équipements supervisés. Écriture réservée aux rôles
    ADMIN et NOC_OPERATOR.
- name: Règles d'alerte
  description: "Seuils, durée de confirmation, seuil de retour et portée. Lecture\
    \ pour tous les rôles, écriture réservée aux administrateurs."
- name: Canaux de notification
  description: "Historique d'envoi, modèles de messages et envoi de test. Réservé\
    \ aux administrateurs. Les URL des canaux (webhook, Teams, Slack) ne sont jamais\
    \ stockées ni renvoyées : on ne manipule que la référence du secret (env:NOM)."
- name: Découverte
  description: "Recherche SNMP d'équipements sur une plage autorisée par l'exploitation.\
    \ Les équipements trouvés sont proposés, jamais créés automatiquement. Réservé\
    \ aux administrateurs."
- name: Règles d'alerte
  description: "Seuils, durée de confirmation, hystérésis et portée des règles."
- name: Import de l'inventaire
  description: "Import CSV des équipements (code_inventaire;nom;adresse;type;statut;site)\
    \ : aperçu puis import des lignes valides. Réservé aux rôles ADMIN et NOC_OPERATOR."
- name: Sites
  description: Emplacements regroupant les équipements. Écriture réservée à ADMIN
    et NOC_OPERATOR.
- name: Maintenances
  description: "Fenêtres pendant lesquelles les alertes d'un site ou d'un équipement\
    \ sont tracées sans notification. Lecture pour tous, planification et annulation\
    \ pour ADMIN et NOC_OPERATOR."
- name: Temps réel
  description: Flux d'événements serveur (SSE) pour rafraîchir les écrans.
- name: Authentification
  description: Jeton d'accès (corps de la réponse) et jeton de renouvellement (cookie
    HttpOnly).
- name: Vues de tableau de bord
  description: Vues personnelles (widgets ordonnés) pour le tableau de bord et le
    mur d'écran NOC. Chaque utilisateur ne voit et ne modifie que ses propres vues.
- name: Topologie
  description: "Dépendances entre équipements et impact d'une panne. Consultation\
    \ pour tous les rôles, modification des liens par les administrateurs."
- name: Métriques
  description: Mesures collectées sur les équipements.
- name: Agents de collecte
  description: Enregistrement des agents par un administrateur et réception de leurs
    mesures (jeton d'agent).
- name: Notifications
  description: Préférences de notification de l'utilisateur connecté.
- name: Vue d'ensemble
  description: Chiffres clés du tableau de bord.
- name: Journal d'audit
  description: "Consultation et export du journal des actions sensibles. Réservé aux\
    \ administrateurs ; le journal est en lecture seule, aucune route ne le modifie."
paths:
  /api/v1/vues/{id}:
    put:
      tags:
      - Vues de tableau de bord
      summary: Modifier une vue
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewRequest"
        required: true
      responses:
        "404":
          description: Vue introuvable
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Rôle insuffisant pour cette action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Vues de tableau de bord
      summary: Supprimer une vue
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Vue introuvable
        "204":
          description: No Content
        "401":
          description: Authentification requise ou jeton expiré
          content:
            application/json:
              schema:
