[defaults]
inventory = inventory/exemple.yml
roles_path = roles
collections_path = collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
# Une tâche marquée no_log ne montre jamais sa valeur, même en mode verbeux.
display_args_to_stdout = False
forks = 20

[ssh_connection]
pipelining = True
