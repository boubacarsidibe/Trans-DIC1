---
# Pipeline d'exemple : construire, tester, publier et déployer l'agent Trans-DIC1 par vagues.
# À copier en .gitlab-ci.yml dans le dépôt du CRI (ou à transposer dans un autre outil : les étapes
# et les garde-fous comptent plus que la syntaxe). Documentation : docs/devops/deploiement-a-grande-echelle.md
#
# Variables à définir dans GitLab (Paramètres > CI/CD > Variables), toutes « Masked » et « Protected » :
#   TRANS_DIC1_ENROLL_TOKEN  jeton d'inscription (tdic1e_…), créé dans Parc > Inscription des agents ;
#   SSH_PRIVATE_KEY          clé du compte de déploiement Linux (type « File ») ;
#   TRANS_DIC1_WINRM_USER, TRANS_DIC1_WINRM_PASSWORD   compte de déploiement Windows ;
#   ANSIBLE_INVENTORY_FILE   inventaire réel (type « File »), jamais versionné ici.
# Aucun secret n'est écrit dans ce fichier ni dans le dépôt.

stages:
  - build
  - test
  - lint
  - publish
  - deploy-canari
  - deploy-production

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ANSIBLE_CORE_VERSION: "2.18.*"
  PACKAGE_REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/trans-dic1-agent"

# --- Construction -----------------------------------------------------------------------------

build:linux:
  stage: build
  image: debian:12-slim
  script:
    - sh agent/packaging/build-package.sh
    - cd agent/dist && sha256sum -c trans-dic1-agent-*.tar.gz.sha256
  artifacts:
    paths:
      - agent/dist/trans-dic1-agent-*.tar.gz
      - agent/dist/trans-dic1-agent-*.tar.gz.sha256
    expire_in: 30 days

build:windows:
  stage: build
  image: mcr.microsoft.com/powershell:lts-debian-12
  script:
    - pwsh -NoProfile -File agent/packaging/windows/build-package.ps1
  artifacts:
    paths:
      - agent/dist/trans-dic1-agent-windows-*.zip
      - agent/dist/trans-dic1-agent-windows-*.zip.sha256
    expire_in: 30 days

# --- Tests de l'agent : version minimale visée et version courante -----------------------------

.agent-tests:
  stage: test
  needs: []
  script:
    - cd agent
    - python -m unittest discover -s tests -t .

test:python-3.8:
  extends: .agent-tests
  image: python:3.8-slim

test:python-3.12:
  extends: .agent-tests
  image: python:3.12-slim
  script:
    - cd agent
    - pip install --quiet coverage==7.6.1
    - python -m coverage run --branch -m unittest discover -s tests -t .
    - python -m coverage report --include="trans_dic1_agent/*" --fail-under=80

# --- Contrôle du déploiement lui-même ------------------------------------------------------------

lint:ansible:
  stage: lint
  image: python:3.12-slim
  needs: ["build:linux"]
  variables:
    TRANS_DIC1_ENROLL_TOKEN: "tdic1e_jeton-de-simulation-sans-valeur"
  script:
    - pip install --quiet "ansible-core==${ANSIBLE_CORE_VERSION}" yamllint
    - cd deploy/ansible
    - ansible-galaxy collection install -r requirements.yml -p collections
    - yamllint -c ../.yamllint .
    - ansible-playbook -i inventory/exemple.yml playbooks/deploy-agent.yml --syntax-check
    # Simulation sur la machine du pipeline elle-même : aucun réseau, aucun secret réel.
    - ansible-playbook -i tests/inventaire-local.yml playbooks/deploy-agent.yml --check -e trans_dic1_agent_systemd=false
    - python3 -m unittest discover -s ../inventaire/tests -t ../inventaire

# --- Publication dans le registre de paquets ------------------------------------------------------

publish:package:
  stage: publish
  image: curlimages/curl:8.11.1
  needs: ["build:linux", "build:windows", "test:python-3.8", "test:python-3.12", "lint:ansible"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^agent-v/
  script:
    - VERSION="${CI_COMMIT_TAG#agent-v}"
    - |
      for file in agent/dist/*; do
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$file" "${PACKAGE_REGISTRY}/${VERSION}/$(basename "$file")"
      done

# --- Déploiement par vagues -------------------------------------------------------------------

.deploy:
  image: python:3.12-slim
  needs: ["build:linux", "build:windows", "publish:package"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^agent-v/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client >/dev/null
    - pip install --quiet "ansible-core==${ANSIBLE_CORE_VERSION}" pywinrm[kerberos]
    - cd deploy/ansible && ansible-galaxy collection install -r requirements.yml -p collections
    - install -m 600 "$SSH_PRIVATE_KEY" /tmp/deploiement.key
    - test -n "$TRANS_DIC1_ENROLL_TOKEN" || { echo "TRANS_DIC1_ENROLL_TOKEN absent"; exit 1; }
  after_script:
    - rm -f /tmp/deploiement.key

# Vague 1 : le petit groupe de test, sans intervention. Un échec arrête le pipeline ici.
deploy:canari:
  extends: .deploy
  stage: deploy-canari
  environment:
    name: canari
  script:
    - >-
      ansible-playbook -i "$ANSIBLE_INVENTORY_FILE" playbooks/deploy-agent.yml
      --limit canari --private-key /tmp/deploiement.key
      -e trans_dic1_agent_version="${CI_COMMIT_TAG#agent-v}"

# Vagues 2 et 3 : 10 % de la production, puis le reste (serial dans le playbook).
# Approbation manuelle obligatoire ; max_fail_percentage: 0 arrête tout au premier échec.
deploy:production:
  extends: .deploy
  stage: deploy-production
  needs: ["build:linux", "build:windows", "publish:package", "deploy:canari"]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG =~ /^agent-v/
      when: manual
  allow_failure: false
  script:
    - >-
      ansible-playbook -i "$ANSIBLE_INVENTORY_FILE" playbooks/deploy-agent.yml
      --limit production --private-key /tmp/deploiement.key
      -e trans_dic1_agent_version="${CI_COMMIT_TAG#agent-v}"
      -e '{"trans_dic1_serial": ["10%", "100%"]}'
