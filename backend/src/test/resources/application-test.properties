# La source de données est fournie par EmbeddedPostgresInitializer (PostgreSQL 16 embarqué, sans Docker).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
JWT_SECRET=test-only-secret-with-at-least-thirty-two-characters
METRICS_SCRAPE_TOKEN=test-only-metrics-token-with-32-characters-min

# Les suites de tests enchainent de nombreuses connexions depuis la meme adresse.
security.login.rate-limit.attempts=1000

# Les tâches planifiées ne tournent pas pendant les tests : ils appellent les services directement,
# sans risque qu'une exécution à heure fixe modifie les données d'un test en cours.
app.scheduling.enabled=false

# Reprises immediates en test : les tentatives se suivent sans attendre.
notification.retry-backoff-seconds=0

# Collecte SNMP dans le thread du test : les donnees du test (non validees) y restent visibles.
collection.snmp.parallelism=1
