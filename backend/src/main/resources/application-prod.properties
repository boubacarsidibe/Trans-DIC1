# Profil de production : la documentation de l'API n'est jamais exposée.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logs JSON au format ECS (Elastic Common Schema) : correlationId, traceId et spanId inclus,
# directement exploitables par un collecteur de logs.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=${APP_ENV:production}
