spring.application.name=trans-dic1-backend
server.port=${APP_PORT:8080}
# Derrière le reverse proxy (US23) : FORWARD_HEADERS_STRATEGY=native pour lire l'adresse du client et
# le protocole dans X-Forwarded-*. Laissé à none quand l'API est exposée directement : un client
# pourrait sinon choisir l'adresse prise en compte par la limitation des connexions.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:trans_dic1}
spring.datasource.username=${DATABASE_USER:trans_dic1}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [correlationId:%X{correlationId:-none}]

# Observabilité (ARCH-08, docs/devops/observability.md).
# /actuator/prometheus n'est ouvert qu'avec le jeton METRICS_SCRAPE_TOKEN (32 caractères minimum).
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.scheduled.job.duration=true
# Traces : identifiants de trace toujours présents dans les logs ; export OTLP désactivé par défaut,
# activé avec TRACING_EXPORT_ENABLED=true vers un collecteur (Jaeger dans le profil Compose).
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes.deployment.environment=${APP_ENV:development}
# Spans des requêtes SQL sans les valeurs des paramètres (données potentiellement sensibles).
jdbc.datasource-proxy.include-parameter-values=false
jdbc.datasource-proxy.query.enable-logging=false

# Documentation OpenAPI : active par défaut, désactivée avec OPENAPI_ENABLED=false
# ou avec le profil "prod" (voir application-prod.properties).
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=false

# Protection de la connexion (SEC-01)
# Limitation de debit par adresse IP, puis verrouillage progressif d un compte
# apres plusieurs echecs consecutifs (1 min, 2 min, 4 min... plafonne).
security.login.rate-limit.attempts=${LOGIN_RATE_LIMIT_ATTEMPTS:10}
security.login.rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
security.login.lock-threshold=${LOGIN_LOCK_THRESHOLD:5}
security.login.lock-base-seconds=${LOGIN_LOCK_BASE_SECONDS:60}
security.login.lock-max-seconds=${LOGIN_LOCK_MAX_SECONDS:1800}

# Migrations Flyway : un seul dossier, appliqué à l'identique en développement, en test et en production.
spring.flyway.locations=classpath:db/migration

# Connexion unique OIDC (ARCH-09, ADR-0017) : désactivée par défaut. Le fournisseur (Keycloak de
# l'EPT ou un autre) émet les jetons ; le backend les valide (émetteur, signature, expiration) et
# convertit les rôles. La connexion locale peut rester ouverte en secours (compte de bootstrap).
auth.local.enabled=${AUTH_LOCAL_ENABLED:true}
auth.oidc.enabled=${OIDC_ENABLED:false}
auth.oidc.issuer-uri=${OIDC_ISSUER_URI:}
# Facultatif : adresse des clés vue du backend quand elle diffère de celle du navigateur.
auth.oidc.jwk-set-uri=${OIDC_JWK_SET_URI:}
auth.oidc.client-id=${OIDC_CLIENT_ID:trans-dic1-web}
auth.oidc.scopes=${OIDC_SCOPES:openid profile email}
auth.oidc.role.admin=${OIDC_ROLE_ADMIN:trans-dic1-admin}
auth.oidc.role.noc=${OIDC_ROLE_NOC:trans-dic1-noc}
auth.oidc.role.viewer=${OIDC_ROLE_VIEWER:trans-dic1-viewer}

# Renouvellement de jeton (ADR-0005) : cookie HttpOnly, SameSite=Strict, durée maximale de connexion 8 h.
# cookie-secure=false uniquement pour un développement en HTTP hors localhost.
security.refresh.cookie-name=${REFRESH_COOKIE_NAME:trans_dic1_refresh}
security.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:true}
security.refresh.max-age-seconds=${REFRESH_MAX_AGE_SECONDS:28800}

# Partitions mensuelles de la table metric (ADR-0004).
monitoring.metric.partitions-ahead-months=${METRIC_PARTITIONS_AHEAD_MONTHS:3}

# Notifications par e-mail : SMTP interne (Mailpit en developpement), reprises bornees.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
management.health.mail.enabled=false
reporting.schedule.enabled=${REPORT_SCHEDULE_ENABLED:true}
reporting.schedule.zone=${REPORT_SCHEDULE_ZONE:Africa/Dakar}
notification.from=${NOTIFICATION_FROM:trans-dic1@ept.sn}
notification.public-url=${PUBLIC_URL:http://localhost:5173}
notification.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
notification.retry-backoff-seconds=${NOTIFICATION_RETRY_BACKOFF_SECONDS:60}
notification.batch-size=${NOTIFICATION_BATCH_SIZE:50}

# Découverte automatique (FEAT-07) : seules les plages listées ici (CIDR IPv4 séparés par des
# virgules) peuvent être parcourues ; vide, aucune découverte n'est possible. Fixé par l'exploitation.
discovery.allowed-ranges=${DISCOVERY_ALLOWED_RANGES:}
discovery.max-hosts=${DISCOVERY_MAX_HOSTS:256}
discovery.concurrency=${DISCOVERY_CONCURRENCY:8}
discovery.host-timeout-ms=${DISCOVERY_HOST_TIMEOUT_MS:1000}
discovery.max-duration-seconds=${DISCOVERY_MAX_DURATION_SECONDS:300}

# Pool dédié aux tâches planifiées : la collecte ne prend jamais les threads qui servent les requêtes web.
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=tache-

# Regroupement des alertes de collecte (ADR 0014) et détection d'anomalies (ADR 0015).
alerting.correlation.enabled=${ALERT_CORRELATION_ENABLED:true}
alerting.correlation.window-minutes=${ALERT_CORRELATION_WINDOW_MINUTES:5}
threat.window-minutes=${THREAT_WINDOW_MINUTES:5}
threat.auth-failures=${THREAT_AUTH_FAILURES:10}
threat.web-errors=${THREAT_WEB_ERRORS:40}
threat.retention-days=${THREAT_RETENTION_DAYS:30}
alerting.no-data.enabled=${ALERT_NO_DATA_ENABLED:true}
alerting.no-data.after-minutes=${ALERT_NO_DATA_AFTER_MINUTES:30}
alerting.peer.enabled=${ALERT_PEER_ENABLED:true}
alerting.peer.sensitivity=${ALERT_PEER_SENSITIVITY:4.0}
alerting.flapping.threshold=${ALERT_FLAPPING_THRESHOLD:4}
alerting.flapping.window-minutes=${ALERT_FLAPPING_WINDOW_MINUTES:60}
alerting.anomaly.enabled=${ALERT_ANOMALY_ENABLED:true}
alerting.anomaly.sensitivity=${ALERT_ANOMALY_SENSITIVITY:3.5}

# Astreinte (F2.2, ADR 0025) : la personne d'astreinte principale est prévenue à l'ouverture d'une
# alerte d'au moins cette sévérité, la secondaire si l'alerte est encore ouverte après le délai
# (plus court si critique). L'escalade aux administrateurs (alerting.escalation.*) reste le dernier
# niveau. Les rotations sont prolongées chaque nuit pour garder l'horizon de gardes générées.
oncall.notify-min-severity=${ONCALL_NOTIFY_MIN_SEVERITY:WARNING}
oncall.secondary-after-minutes=${ONCALL_SECONDARY_AFTER_MINUTES:10}
oncall.critical-secondary-after-minutes=${ONCALL_CRITICAL_SECONDARY_AFTER_MINUTES:5}
oncall.escalation.cron=${ONCALL_ESCALATION_CRON:20 * * * * *}
oncall.rotation.horizon-days=${ONCALL_ROTATION_HORIZON_DAYS:60}
oncall.rotation.extend-cron=${ONCALL_ROTATION_EXTEND_CRON:0 30 2 * * *}

# Prévision de saturation (ADR 0020) : droite des moindres carrés sur les moyennes horaires de la
# fenêtre ; alerte FORECAST si la limite est prévue dans l'horizon avec un r² suffisant.
forecast.enabled=${FORECAST_ENABLED:true}
forecast.cron=${FORECAST_CRON:0 7 * * * *}
forecast.keys=${FORECAST_KEYS:disk.usage,memory.usage}
forecast.window-days=${FORECAST_WINDOW_DAYS:14}
forecast.min-span-days=${FORECAST_MIN_SPAN_DAYS:3}
forecast.min-points=${FORECAST_MIN_POINTS:24}
forecast.limit=${FORECAST_LIMIT:100}
forecast.min-r2=${FORECAST_MIN_R2:0.6}
forecast.horizon-days=${FORECAST_HORIZON_DAYS:14}

# Diagnostic d'incident (F2.1, ADR 0024) : demi-fenêtre d'analyse autour de l'ouverture de l'alerte
# (alertes voisines, événements, changements), bornée à 1..1440 min, et fuseau des heures du résumé.
diagnostic.window-minutes=${DIAGNOSTIC_WINDOW_MINUTES:30}
diagnostic.time-zone=${DIAGNOSTIC_TIME_ZONE:Africa/Dakar}

# Relais des événements entre instances par PostgreSQL LISTEN/NOTIFY (ADR 0016). À activer dès qu'il
# y a plus d'une instance du backend.
broker.enabled=${BROKER_ENABLED:false}
broker.channel=trans_dic1_events
broker.relay-interval-ms=${BROKER_RELAY_INTERVAL_MS:1000}

# Sondes sans agent : fréquence de recherche des services à échéance et nombre de sondes simultanées.
collection.probe.scan-interval-ms=${PROBE_SCAN_INTERVAL_MS:15000}
collection.probe.parallelism=${PROBE_PARALLELISM:16}
# Plafond de services par passage : un passage doit finir dans le verrou de 5 minutes de la tâche.
collection.snmp.interfaces.enabled=${SNMP_INTERFACES_ENABLED:true}
collection.snmp.interfaces.scan-interval-ms=${SNMP_INTERFACES_SCAN_INTERVAL_MS:60000}
collection.snmp.interfaces.discovery-interval-minutes=${SNMP_INTERFACES_DISCOVERY_MINUTES:60}
collection.snmp.interfaces.max-per-equipment=${SNMP_INTERFACES_MAX:256}
collection.probe.icmp.packets=${PROBE_ICMP_PACKETS:4}
collection.probe.max-per-scan=${PROBE_MAX_PER_SCAN:500}

# Récepteurs de traps SNMP et de syslog (ADR 0021, docs/devops/evenements-reseau.md) : désactivés
# par défaut. Ports non privilégiés (162 et 514 demandent des droits root). Seule une source dont
# l'adresse IP est l'adresse de gestion d'un équipement supervisé est acceptée.
events.snmp-trap.enabled=${EVENTS_SNMP_TRAP_ENABLED:false}
events.snmp-trap.bind-address=${EVENTS_SNMP_TRAP_BIND_ADDRESS:0.0.0.0}
events.snmp-trap.port=${EVENTS_SNMP_TRAP_PORT:1162}
# Référence (env:NOM) de la communauté attendue en v1/v2c ; vide : traps non authentifiés (WARN).
events.snmp-trap.community=${EVENTS_SNMP_TRAP_COMMUNITY:}
# Utilisateur SNMPv3 unique (SHA / AES-128) ; mots de passe donnés par référence env:NOM.
events.snmp-trap.v3.username=${EVENTS_SNMP_TRAP_V3_USERNAME:}
events.snmp-trap.v3.auth-reference=${EVENTS_SNMP_TRAP_V3_AUTH_REFERENCE:}
events.snmp-trap.v3.priv-reference=${EVENTS_SNMP_TRAP_V3_PRIV_REFERENCE:}
events.syslog.enabled=${EVENTS_SYSLOG_ENABLED:false}
events.syslog.bind-address=${EVENTS_SYSLOG_BIND_ADDRESS:0.0.0.0}
events.syslog.port=${EVENTS_SYSLOG_PORT:1514}
events.rate-limit-per-source=${EVENTS_RATE_LIMIT_PER_SOURCE:100}
events.queue-capacity=${EVENTS_QUEUE_CAPACITY:10000}
events.workers=${EVENTS_WORKERS:2}
events.source-cache-seconds=${EVENTS_SOURCE_CACHE_SECONDS:30}
events.rule-cache-seconds=${EVENTS_RULE_CACHE_SECONDS:10}
events.retention-days=${EVENTS_RETENTION_DAYS:30}
events.retention-cron=${EVENTS_RETENTION_CRON:0 15 4 * * *}

# Pages de statut (F2.3, ADR 0026) : instantané d'une page gardé en cache (s), disponibilité sur
# 90 jours recalculée au plus toutes les availability-cache-seconds, lecture publique sans connexion
# limitée par adresse IP (requêtes par minute, puis 429 avec Retry-After). Incident automatique
# « Perturbation détectée » désactivé par défaut : ouvert après N minutes de panne majeure d'un
# composant, résolu au rétablissement.
statuspage.cache-seconds=${STATUSPAGE_CACHE_SECONDS:30}
statuspage.availability-cache-seconds=${STATUSPAGE_AVAILABILITY_CACHE_SECONDS:300}
statuspage.public.rate-limit-per-minute=${STATUSPAGE_PUBLIC_RATE_LIMIT_PER_MINUTE:60}
statuspage.auto-incident.enabled=${STATUSPAGE_AUTO_INCIDENT_ENABLED:false}
statuspage.auto-incident.minutes=${STATUSPAGE_AUTO_INCIDENT_MINUTES:5}
statuspage.auto-incident.cron=${STATUSPAGE_AUTO_INCIDENT_CRON:40 * * * * *}