# Collecte des métriques de la plateforme (ARCH-08). Voir docs/devops/observability.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: trans-dic1-backend
    metrics_path: /actuator/prometheus
    # Jeton METRICS_SCRAPE_TOKEN, fourni par Compose dans un fichier : jamais dans cette configuration.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    static_configs:
      - targets: ["backend:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
