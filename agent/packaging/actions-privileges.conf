# Complément systemd pour les actions correctives (ADR 0057) : à installer SEULEMENT si l'agent a
# des actions qui passent par sudo.
#   /etc/systemd/system/trans-dic1-agent.service.d/actions.conf
#
# Le service de l'agent est durci (NoNewPrivileges, ProtectSystem=strict, aucune capacité) : sudo
# ne peut alors pas élever les droits, et une commande lancée par sudo hériterait d'un système de
# fichiers en lecture seule. Ce complément rouvre juste ce qu'il faut :
#  - sudo peut élever les droits (pour les seules commandes autorisées dans /etc/sudoers.d) ;
#  - les dossiers que touchent les actions du catalogue sont modifiables.
# Le reste du durcissement (PrivateTmp, ProtectHome, familles d'adresses, mémoire) est conservé.
[Service]
NoNewPrivileges=no
CapabilityBoundingSet=~
ReadWritePaths=/var/log /var/cache /var/tmp /run
