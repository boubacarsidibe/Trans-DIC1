# Environnement local complet : PostgreSQL, backend, frontend et Mailpit.
#   docker compose up --build
# Service de sauvegarde en option (OPS-02) : docker compose --profile backup up -d --build
# Les variables sont lues dans le fichier .env à la racine (voir .env.example).

name: trans-dic1

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-trans_dic1}
      POSTGRES_USER: ${DATABASE_USER:-trans_dic1}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD est obligatoire dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Port 5433 côté hôte pour ne pas entrer en conflit avec un PostgreSQL local.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sauvegarde chiffrée et restauration de contrôle quotidiennes (OPS-02).
  backup:
    build:
      context: ./backup
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-trans_dic1}
      DATABASE_USER: ${DATABASE_USER:-trans_dic1}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD est obligatoire dans .env}
      # Obligatoire (32 caractères minimum) : le conteneur refuse de démarrer sans elle.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RESTORE_CHECK: ${BACKUP_RESTORE_CHECK:-true}
      RTO_SECONDS: ${RTO_SECONDS:-14400}
    volumes:
      # Volume nommé par défaut ; en production, un dossier monté depuis un stockage distinct
      # du serveur applicatif (BACKUP_HOST_DIR=/chemin), accessible en écriture à l'uid 70.
      - ${BACKUP_HOST_DIR:-backup-data}:/backups

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # interface web
      - "127.0.0.1:1025:1025" # SMTP de test

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-trans_dic1}
      DATABASE_USER: ${DATABASE_USER:-trans_dic1}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD est obligatoire dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire dans .env (32 caractères minimum, ex. openssl rand -hex 32)}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_MAX_AGE_SECONDS: ${REFRESH_MAX_AGE_SECONDS:-28800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-trans-dic1@ept.sn}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
      # Observabilité (ARCH-08) : jeton de collecte Prometheus et export des traces vers Jaeger.
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      # Découverte automatique (FEAT-07) : plages autorisées par l'exploitation.
      DISCOVERY_ALLOWED_RANGES: ${DISCOVERY_ALLOWED_RANGES:-}
      # Connexion unique (ARCH-09) : avec le profil « sso », OIDC_ENABLED=true et
      # OIDC_ISSUER_URI=http://localhost:8180/realms/trans-dic1 dans .env.
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-true}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      # Dans le réseau Docker, « localhost » n'est pas Keycloak : les clés sont lues par son nom.
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8180/realms/trans-dic1/protocol/openid-connect/certs}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-trans-dic1-web}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:8080"

  # --- Connexion unique de développement (ARCH-09), profil « sso » --------------------------------
  # docker compose --profile sso up -d keycloak
  # Royaume trans-dic1 importé au démarrage : client public trans-dic1-web (PKCE S256), trois rôles et
  # trois comptes de démonstration. Mode développement uniquement : en production, c'est le
  # fournisseur du CRI qui est utilisé (docs/devops/connexion-unique.md).
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: ["sso"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD est obligatoire dans .env pour le profil sso}
      # Même nom d'hôte pour le navigateur et pour le backend (émetteur identique dans les jetons).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./deploy/keycloak/trans-dic1-realm.json:/opt/keycloak/data/import/trans-dic1-realm.json:ro
    ports:
      - "127.0.0.1:8180:8180"

  # --- Observabilité (ARCH-08), profil « observability » ---------------------------------------
  # docker compose --profile observability up -d --build
  # Interfaces accessibles depuis le poste uniquement (127.0.0.1).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    configs:
      - source: scrape-token
        target: /etc/prometheus/scrape-token
        mode: 0444
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Vide : compte admin/admin, changement imposé à la première connexion.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # interface des traces

configs:
  # Le jeton de collecte reste dans .env ; Prometheus le lit dans un fichier monté.
  scrape-token:
    content: ${METRICS_SCRAPE_TOKEN:-}

volumes:
  postgres-data:
  backup-data:
  prometheus-data:
  grafana-data:
